{% extends "layout.html" %}

{% block contenido %}

<div class="container pt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">Register</div>
          <div class="card-body">
            <form method="POST" action="/registro">
                <div class="mb-3 row">
                  <label for="nombre" class="col-md-4 col-form-label text-md-end">Username</label>

                  <div class="col-md-6">
                    <input id="username" type="text" class="form-control" name="username" autocomplete="username" autofocus>
                  </div>
                </div>

                <div class="mb-3 row">
                  <label for="email" class="col-md-4 col-form-label text-md-end">Email</label>

                  <div class="col-md-6">
                    <input id="email" type="email" class="form-control" name="email" autocomplete="email" autofocus>
                  </div>
                </div>

                <div class="mb-3 row">
                    <label for="cedula" class="col-md-4 col-form-label text-md-end">Cedula</label>

                    <div class="col-md-6">
                      <input id="cedula" type="text" class="form-control" name="cedula" autofocus>
                    </div>
                  </div>


                <div class="mb-3 row">
                  <label for="password" class="col-md-4 col-form-label text-md-end">Password</label>

                  <div class="col-md-6">
                    <input id="password" type="password" class="form-control" name="password" autocomplete="password" autofocus>
                  </div>
                </div>

                <div class="mb-3 row">
                  <div class="col-md-6 offset-md-4">
                    <button type="submit" class="btn btn-primary">Submit</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>


    {%endblock%}
